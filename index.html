<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moon Memory</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<div id="stars"></div>

<div class="moon"></div>

<div class="overlay"></div>

<div class="container">

<div class="date">

17 Mordad 1405

</div>

<div class="glass">

<div class="photo">

<img src="images/photo.jpg" id="mainPhoto">

</div>

<h1 class="title">

Happy Birthday

</h1>

<p class="subtitle">

May you always smile,<br>

shine,<br>

and be surrounded by happiness.

</p>

<div class="birds">

🐦 🐦

</div>

<div class="music-row">

<div class="music-icon">

🎵

</div>

<div class="qr-box"><div class="qr-content">

<div class="qr-placeholder">

QR CODE

</div>

<p class="scan-text">

Scan Me

</p>

</div>

</div>


<div class="login-panel">

<div class="lock">

🔐

</div>


<h2>

Enter The Secret Code

</h2>


<input 
type="password" 
id="passwordInput" 
placeholder="Password">


<button id="unlockBtn">

Unlock

</button>


<p id="message"></p>


</div>


</div>


<audio id="wrongMusic">

<source src="music/vigen.mp3" type="audio/mpeg">

</audio>


<audio id="mainMusic">

<source src="music/main.mp3" type="audio/mpeg">

</audio>


<div id="successScreen">

<div class="success-image">

<img src="images/photo.jpg">

</div>


<h1>

Happy Birthday ❤️

</h1>


<p>

A beautiful memory begins...

</p>


</div><script>

const unlockBtn = document.getElementById("unlockBtn");

const passwordInput = document.getElementById("passwordInput");

const message = document.getElementById("message");

const loginPanel = document.querySelector(".login-panel");

const successScreen = document.getElementById("successScreen");

const wrongMusic = document.getElementById("wrongMusic");

const mainMusic = document.getElementById("mainMusic");


unlockBtn.addEventListener("click", function(){


let password = passwordInput.value;



if(password === "0919"){


loginPanel.style.display = "none";


successScreen.style.display = "block";


setTimeout(function(){

mainMusic.play();

},3000);



}

else{


message.innerHTML = "Wrong Code... Try Again";


document.body.classList.add("wrong");


wrongMusic.play();



}


});



</script>


</body>

</html>
